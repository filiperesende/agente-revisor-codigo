name: CI

# Executa lint, testes e uma validação de build a cada push e pull request
# nas branches principais. O deploy não faz parte do escopo do projeto.
on:
  push:
    branches: [main, develop, "feature/**", "docs/**"]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Etapa 1 — Lint (análise estática de estilo/erros)
      - name: Lint (ruff)
        run: ruff check src tests run_review.py conftest.py

      # Etapa 2 — Testes automatizados (unitários + integração + E2E)
      # Sem chave de API no CI: o agente roda em modo mock (determinístico).
      - name: Testes (pytest)
        run: pytest -q

      # Etapa 3 — Validação de build (compilação e import do pacote)
      - name: Build / validação
        run: |
          python -m compileall src
          python -c "import src.agent; print('import do pacote OK')"
